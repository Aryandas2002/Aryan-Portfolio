name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate downloadable resume PDF
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --no-pdf-header-footer --print-to-pdf="$PWD/public/Aryan_Das_Resume.pdf" \
            "file://$PWD/public/resume.html"
          test -s public/Aryan_Das_Resume.pdf
          test "$(head -c 5 public/Aryan_Das_Resume.pdf)" = '%PDF-'
      - run: npm run build
        env:
          VITE_TESTIMONIAL_API_URL: ${{ vars.VITE_TESTIMONIAL_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
